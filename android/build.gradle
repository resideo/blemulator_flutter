group 'com.polidea.blemulator'
version '1.2.1'

buildscript {
    repositories {
        google()
        jcenter()
        maven { url "https://jitpack.io" }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:3.5.3'
    }
}

rootProject.allprojects {
    repositories {
        google()
        jcenter()
        maven { url "https://jitpack.io" }
        maven {
            url = 'https://maven.pkg.github.com/resideo/MultiPlatformBleAdapter'
            credentials {
                username = System.getenv('GITHUB_ACTOR') ?: System.getenv('GITHUB_USER')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}

apply plugin: 'com.android.library'

android {
    compileSdkVersion 35
    namespace "com.polidea.blemulator"

    defaultConfig {
        minSdkVersion 28
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    lintOptions {
        disable 'InvalidPackage'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.github.resideo:multiplatformbleadapter:1.0.6'
}
